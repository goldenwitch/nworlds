name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check reusable library and host surface
        run: cargo check -p engine-time -p engine-sdk -p engine-journal -p engine-branches -p engine-index -p engine-presentation -p engine-api -p nworlds-host --locked
      - name: Run library boundary evidence
        run: |
          cargo test -p purity-tests --test generic_consumer --locked
          cargo test -p purity-tests --test dependency_boundaries --locked
          cargo test -p purity-tests --test boundary --locked
          cargo test -p nworlds-host --locked
      - name: Check independent voxel sample
        run: cargo check -p voxel-sample --locked
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run conformance tests
        run: cargo test --manifest-path tests/conformance/Cargo.toml --locked

  windows-host:
    name: Windows host build
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Compile the native host
        run: cargo check --manifest-path crates/nworlds-desktop/Cargo.toml --locked

  arch-linux-host:
    name: Arch Linux host build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Compile in Arch Linux
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed \
                ca-certificates curl git rustup pkgconf clang \
                vulkan-headers libx11 libxcursor libxi libxrandr \
                libxinerama libxkbcommon wayland
              export RUSTUP_HOME=/opt/rustup
              export CARGO_HOME=/opt/cargo
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | \
                sh -s -- -y --default-toolchain none --profile minimal
              . "$CARGO_HOME/env"
              rustup toolchain install 1.94.1 --profile minimal
              cargo +1.94.1 check \
                --manifest-path crates/nworlds-desktop/Cargo.toml \
                --locked
            '
