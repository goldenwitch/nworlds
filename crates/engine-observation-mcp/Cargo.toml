[package]
name = "engine-observation-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23"
engine-observation = { path = "../engine-observation" }
engine-surface = { path = "../engine-surface" }
engine-time = { path = "../engine-time" }
rmcp = { version = "3.2", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
engine-presentation = { path = "../engine-presentation" }
engine-sdk = { path = "../engine-sdk" }
